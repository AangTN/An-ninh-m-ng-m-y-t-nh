services:
  db:
    image: postgres:16-alpine
    container_name: secretpizza-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cuahangpizza}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-seed:
    image: postgres:16-alpine
    container_name: secretpizza-db-seed
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cuahangpizza}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    volumes:
      - ./backend/cuahangpizza.sql:/seed/cuahangpizza.sql:ro
      - ./docker/db-seed-if-empty.sh:/seed/db-seed-if-empty.sh:ro
    entrypoint: ["/bin/sh", "/seed/db-seed-if-empty.sh"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secretpizza-backend
    restart: unless-stopped
    # Nạp file .env nội bộ của backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123}@db:5432/${POSTGRES_DB:-cuahangpizza}
    # Chỉ expose nội bộ cho Apache gọi, không mở ra ngoài để bảo mật
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    volumes:
      - ./backend/public:/app/public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_MAP_KEY: ${VITE_MAP_KEY}
        VITE_CLIENT_ID: ${VITE_CLIENT_ID}
        VITE_GOOGLE_CLIENT_ID: ${VITE_CLIENT_ID}
    container_name: secretpizza-frontend
    restart: unless-stopped
    ports:
      - "80:80"   # Đưa Apache ra cổng 80 máy thật
      - "443:443" # Mở sẵn cổng 443 cho Apache (nếu bạn cài SSL sau này)
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data: