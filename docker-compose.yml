version: '3.8'

services:
  # Frontend with Apache 2.4 (new option)
  frontend-apache:
    build:
      context: ./frontend
      dockerfile: Dockerfile.apache
    ports:
      - "8080:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:3001
    depends_on:
      - backend
    networks:
      - pizza-network

  # Frontend with Nginx (existing option)
  frontend-nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:3001
    depends_on:
      - backend
    networks:
      - pizza-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pizza
      - NODE_ENV=production
      - PORT=3001
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pizza-network
    volumes:
      - ./backend/public/images:/app/public/images

  # Database
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pizza
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/data.sql:/docker-entrypoint-initdb.d/01-data.sql
      - ./backend/cuahangpizza.sql:/docker-entrypoint-initdb.d/02-cuahangpizza.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pizza-network

networks:
  pizza-network:
    driver: bridge

volumes:
  postgres-data: